<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capulet or Montague? A Verona Sorting Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1220;
    --parchment: #f6ecd6;
    --parchment-dim: #d9c9a6;
    --cap: #8e1226;
    --cap-bright: #c8223c;
    --cap-gold: #e2b44a;
    --mon: #14316b;
    --mon-bright: #2f63c9;
    --mon-silver: #cfd8e8;
    --accent: #e2b44a;
    --accent-2: #c8223c;
    --petal: #c8223c;
    --display: "Cinzel Decorative", "Trajan Pro", Georgia, serif;
    --body: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--body);
    font-size: 1.25rem;
    line-height: 1.5;
    color: var(--parchment);
    background: var(--ink);
    overflow-x: hidden;
    transition: background 0.8s ease;
  }
  /* Verona: the whole page is a stage split between two houses */
  body.stage {
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(200,34,60,.55), transparent 60%),
      radial-gradient(120% 80% at 100% 100%, rgba(47,99,201,.55), transparent 60%),
      var(--ink);
  }
  body.capulet {
    --accent: var(--cap-gold);
    --accent-2: var(--cap-bright);
    --petal: #e0304b;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(226,180,74,.28), transparent 65%),
      linear-gradient(180deg, #5c0a18 0%, #8e1226 55%, #3a0610 100%);
  }
  body.montague {
    --accent: var(--mon-silver);
    --accent-2: var(--mon-bright);
    --petal: #6f9bf0;
    background:
      radial-gradient(90% 60% at 50% 0%, rgba(207,216,232,.25), transparent 65%),
      linear-gradient(180deg, #091a3d 0%, #14316b 55%, #060f26 100%);
  }

  .petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .petal {
    position: absolute; top: -6vh;
    width: 14px; height: 18px;
    background: var(--petal);
    border-radius: 80% 0 80% 0;
    opacity: .75;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0,-6vh,0) rotate(0deg); }
    50%  { transform: translate3d(40px,55vh,0) rotate(180deg); }
    100% { transform: translate3d(-20px,112vh,0) rotate(360deg); }
  }

  main {
    position: relative; z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 56px;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
  }
  .screen { display: none; }
  .screen.on { display: block; animation: rise .55s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1, h2 { font-family: var(--display); font-weight: 900; margin: 0; line-height: 1.12; }
  h1 { font-size: clamp(2rem, 8vw, 3.4rem); text-align: center; text-shadow: 0 3px 18px rgba(0,0,0,.45); }
  h2 { font-size: clamp(1.25rem, 4.6vw, 1.75rem); text-align: center; text-wrap: balance; }
  p { margin: 0 0 1rem; }

  /* ---------- Intro ---------- */
  .prologue {
    text-align: center; font-style: italic; font-size: 1.3rem;
    color: var(--parchment-dim); margin: 1.2rem auto 2rem; max-width: 30ch;
  }
  .houses {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 auto 2rem; max-width: 460px;
  }
  .house-chip {
    border: 2px solid; border-radius: 6px 6px 40px 40px;
    padding: 16px 10px 22px; text-align: center;
    font-family: var(--display); font-size: .95rem; line-height: 1.3;
  }
  .house-chip svg { width: 54px; height: 62px; display: block; margin: 0 auto 8px; }
  .house-chip.c { border-color: var(--cap-gold); background: rgba(142,18,38,.7); color: #ffe9b0; }
  .house-chip.m { border-color: var(--mon-silver); background: rgba(20,49,107,.75); color: #e8eefb; }

  .name-row { text-align: center; margin-bottom: 1.6rem; }
  .name-row label { display: block; font-style: italic; color: var(--parchment-dim); margin-bottom: 6px; }
  .name-row input {
    font: inherit; font-size: 1.25rem; text-align: center;
    width: min(100%, 320px); padding: 10px 14px;
    background: rgba(246,236,214,.95); color: var(--ink);
    border: 2px solid var(--cap-gold); border-radius: 4px;
  }

  .btn {
    display: block; margin: 0 auto;
    font-family: var(--display); font-weight: 700; font-size: 1.05rem;
    padding: 15px 30px; min-height: 52px;
    color: #2a0a10; background: linear-gradient(180deg, #f3cf72, #d19d2d);
    border: 2px solid #fbe6a6; border-radius: 4px;
    cursor: pointer; box-shadow: 0 6px 0 #8a6414, 0 10px 24px rgba(0,0,0,.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #8a6414, 0 8px 20px rgba(0,0,0,.4); }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #8a6414; }
  .btn.ghost {
    background: transparent; color: var(--parchment); border-color: var(--parchment-dim);
    box-shadow: none; margin-top: 14px; font-size: .95rem;
  }
  .btn.ghost:hover { background: rgba(255,255,255,.1); transform: none; box-shadow: none; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- Quiz ---------- */
  .progress-wrap { margin-bottom: 22px; }
  .progress-label { text-align: center; font-style: italic; color: var(--parchment-dim); margin-bottom: 8px; }
  .track { height: 10px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; border: 1px solid rgba(246,236,214,.25); }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cap-bright), var(--cap-gold), var(--mon-bright)); transition: width .5s ease; }

  .scroll {
    background: linear-gradient(180deg, #f8efd9, #ecdcb8);
    color: var(--ink);
    border-radius: 10px;
    padding: 28px 22px 22px;
    box-shadow: 0 0 0 4px #b58a3a, 0 0 0 6px #5b3d0e, 0 24px 50px rgba(0,0,0,.5);
  }
  .scroll h2 { color: #3a0d18; margin-bottom: 22px; }
  .options { display: grid; gap: 12px; }
  .opt {
    font: inherit; font-weight: 700; font-size: 1.2rem; line-height: 1.3;
    text-align: left; color: var(--ink);
    background: rgba(255,255,255,.55);
    border: 2px solid #b58a3a; border-radius: 8px;
    padding: 14px 16px; min-height: 56px; cursor: pointer;
    transition: background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .opt:hover { background: #fff7e0; transform: translateX(4px); border-color: #8e1226; }
  .opt.picked { background: #8e1226; color: #fff3d0; border-color: #e2b44a; }
  .opt:disabled { cursor: default; }

  /* ---------- Result ---------- */
  .result { text-align: center; }
  .crest { width: min(210px, 52vw); margin: 0 auto 10px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.5)); animation: crest 1.1s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes crest { from { transform: scale(.3) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .belong { font-style: italic; color: var(--accent); font-size: 1.3rem; margin-bottom: 4px; }
  .result h1 { color: var(--accent); }
  .tagline { font-style: italic; font-size: 1.45rem; margin: 10px 0 20px; }
  .card {
    text-align: left;
    background: rgba(0,0,0,.28);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 18px 20px; margin: 16px 0;
  }
  .card h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 8px; color: var(--accent); }
  .card ul { margin: 0; padding-left: 1.2rem; }
  .card li { margin-bottom: 4px; }
  .motto { font-family: var(--display); font-size: 1.15rem; margin: 22px 0 6px; text-wrap: balance; }
  .quote { font-style: italic; color: var(--parchment-dim); margin-bottom: 20px; }
  .split { margin: 22px 0 6px; }
  .split-bar { display: flex; height: 22px; border-radius: 99px; overflow: hidden; border: 2px solid var(--accent); }
  .split-bar .c { background: linear-gradient(90deg, #8e1226, #c8223c); }
  .split-bar .m { background: linear-gradient(90deg, #2f63c9, #14316b); }
  .split-text { display: flex; justify-content: space-between; margin-top: 6px; font-weight: 700; }
  .screenshot { font-style: italic; color: var(--parchment-dim); margin-top: 22px; }

  @media (prefers-reduced-motion: reduce) {
    .petal, .crest { animation: none; }
    .screen.on { animation: none; }
    .fill, .opt { transition: none; }
  }
</style>
</head>
<body class="stage">
<div class="petals" id="petals" aria-hidden="true"></div>

<main>

  <!-- INTRO -->
  <section class="screen on" id="intro">
    <h1>Which House Are You?</h1>
    <p class="prologue">Two households, both alike in dignity, in fair Verona, where we lay our scene.</p>

    <div class="houses" aria-hidden="true">
      <div class="house-chip c">
        <svg viewBox="0 0 100 116"><use href="#shield-cap"/></svg>
        House Capulet
      </div>
      <div class="house-chip m">
        <svg viewBox="0 0 100 116"><use href="#shield-mon"/></svg>
        House Montague
      </div>
    </div>

    <div class="name-row">
      <label for="nameInput">Your name, fair maiden (optional)</label>
      <input id="nameInput" type="text" maxlength="24" autocomplete="off" placeholder="Enter your name">
    </div>

    <button class="btn" id="startBtn">Enter Verona</button>
    <p style="text-align:center;margin-top:20px;color:var(--parchment-dim);font-style:italic;">15 questions. No wrong answers. Just follow your heart.</p>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="progress-wrap">
      <div class="progress-label" id="progLabel">Question 1 of 15</div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="scroll">
      <h2 id="qText"></h2>
      <div class="options" id="opts"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen result" id="result"></section>

</main>

<!-- Shared crest art -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="shield-cap" viewBox="0 0 100 116">
      <path d="M8 6h84v54c0 30-26 46-42 52C34 106 8 90 8 60z" fill="#8e1226" stroke="#e2b44a" stroke-width="5" stroke-linejoin="round"/>
      <path d="M50 14v90" stroke="#e2b44a" stroke-width="2" opacity=".45"/>
      <g transform="translate(50 52)">
        <g fill="#e2b44a">
          <circle r="9"/>
          <circle cx="0" cy="-17" r="11"/><circle cx="16" cy="-6" r="11"/><circle cx="10" cy="14" r="11"/>
          <circle cx="-10" cy="14" r="11"/><circle cx="-16" cy="-6" r="11"/>
        </g>
        <g fill="#c8223c">
          <circle r="5.5"/>
          <circle cx="0" cy="-17" r="6"/><circle cx="16" cy="-6" r="6"/><circle cx="10" cy="14" r="6"/>
          <circle cx="-10" cy="14" r="6"/><circle cx="-16" cy="-6" r="6"/>
        </g>
      </g>
    </symbol>
    <symbol id="shield-mon" viewBox="0 0 100 116">
      <path d="M8 6h84v54c0 30-26 46-42 52C34 106 8 90 8 60z" fill="#14316b" stroke="#cfd8e8" stroke-width="5" stroke-linejoin="round"/>
      <path d="M50 14v90" stroke="#cfd8e8" stroke-width="2" opacity=".4"/>
      <path d="M62 28a28 28 0 1 0 0 52a22 22 0 1 1 0-52z" fill="#cfd8e8"/>
      <polygon points="66,44 69.5,52 78,53 71.6,58.6 73.6,67 66,62.6 58.4,67 60.4,58.6 54,53 62.5,52" fill="#cfd8e8" transform="translate(4 -2)"/>
    </symbol>
  </defs>
</svg>

<script>
(function () {
  // Each answer quietly leans toward a house: C = Capulet, M = Montague.
  // Every question has two Capulet-leaning and two Montague-leaning answers.
  // 15 questions, one point each, so there can never be a tie.
  var QUESTIONS = [
    { q: "Which color palette makes your heart skip a beat?", a: [
      ["Crimson red and shining gold", "C"],
      ["Deep sapphire blue and silver", "M"],
      ["Velvet burgundy and rose", "C"],
      ["Midnight navy and moonlight white", "M"] ]},
    { q: "It's Saturday night. Where do you want to be?", a: [
      ["Hosting a grand party in a gorgeous dress", "C"],
      ["Sneaking off on a moonlit adventure with my best friends", "M"],
      ["At an elegant dinner where everyone is dressed to impress", "C"],
      ["Under the stars, talking about everything and nothing", "M"] ]},
    { q: "What do you value most in the world?", a: [
      ["Family, honor, and carrying on traditions", "C"],
      ["Loyalty to my friends, no matter what", "M"],
      ["Pride and standing tall in front of everyone", "C"],
      ["Freedom to follow my heart", "M"] ]},
    { q: "Someone says something rude about your friend. What do you do?", a: [
      ["Fire back with a sharp, witty comeback", "C"],
      ["Step in front of my friend and calm things down", "M"],
      ["Make it very clear that they chose the wrong girl to mess with", "C"],
      ["Pull my friend aside and say, 'They're not worth it'", "M"] ]},
    { q: "Pick a flower for your bouquet.", a: [
      ["A single perfect red rose", "C"],
      ["Blue hydrangeas", "M"],
      ["Dark burgundy dahlias", "C"],
      ["Soft white lilies", "M"] ]},
    { q: "Pick a superpower.", a: [
      ["Commanding every room I walk into", "C"],
      ["Reading what people truly feel", "M"],
      ["Never losing an argument", "C"],
      ["Making friends with anyone, anywhere", "M"] ]},
    { q: "What does your friend group look like?", a: [
      ["A big, glamorous crowd, and I'm the center of it", "C"],
      ["A small, tight crew who would do anything for me", "M"],
      ["A well-organized squad where everyone has a role", "C"],
      ["A loud, funny team of misfits I adore", "M"] ]},
    { q: "Which outfit sounds most like you?", a: [
      ["Tailored, polished, and never wrinkled", "C"],
      ["Comfy, flowy, and effortless", "M"],
      ["Something sparkly that turns heads", "C"],
      ["Whatever feels right today", "M"] ]},
    { q: "Which time of day feels the most magical?", a: [
      ["Golden sunset, when the whole sky is on fire", "C"],
      ["Midnight, when the world goes quiet", "M"],
      ["High noon, when everything is bright and busy", "C"],
      ["Early dawn, when everything feels brand new", "M"] ]},
    { q: "How would your closest friends describe you?", a: [
      ["Bold and fierce", "C"],
      ["Loyal and dreamy", "M"],
      ["Confident and polished", "C"],
      ["Kind and spontaneous", "M"] ]},
    { q: "How do you feel about rules?", a: [
      ["They exist for a reason. Tradition matters.", "C"],
      ["They're more like suggestions if the cause is good", "M"],
      ["I follow them, and I expect others to as well", "C"],
      ["I'd bend them for the people I love", "M"] ]},
    { q: "Choose your dream gift.", a: [
      ["A sparkling jeweled necklace", "C"],
      ["A handwritten letter that says everything", "M"],
      ["A fancy gown for a ball", "C"],
      ["A tiny keepsake with a secret meaning", "M"] ]},
    { q: "What would the soundtrack of your life sound like?", a: [
      ["A full orchestra with trumpets and drums", "C"],
      ["One guitar and a really honest voice", "M"],
      ["A dramatic opera with big high notes", "C"],
      ["A cozy playlist of songs with feelings", "M"] ]},
    { q: "A rival challenges you in front of everyone. You...", a: [
      ["Rise to the challenge and win", "C"],
      ["Try to make peace before it gets ugly", "M"],
      ["Lift my chin and show them who I am", "C"],
      ["Smile, shrug, and walk away with my head high", "M"] ]},
    { q: "Pick the motto you'd stitch onto a pillow.", a: [
      ["Family first, always.", "C"],
      ["Follow your heart.", "M"],
      ["Hold your head high.", "C"],
      ["Love conquers all.", "M"] ]}
  ];

  var RESULTS = {
    C: {
      cls: "capulet",
      house: "House Capulet",
      tagline: "Bold. Radiant. Impossible to ignore.",
      desc: "You walk into a room and the candles seem to burn brighter. You're proud, polished, and fiercely loyal to your family and traditions. When you love something, you give it everything. Just be careful, because pride has started a few feuds in Verona.",
      traits: [
        "Crimson and gold run through your veins",
        "You value honor, family, and legacy",
        "Confident, elegant, and a little dramatic (in the best way)",
        "You throw the best parties in Verona"
      ],
      crew: "Your Verona crew: Juliet, Lady Capulet, and the Nurse (who knows all your secrets).",
      motto: "Hold your head high, and your family closer.",
      quote: "\u201CWhat\u2019s in a name? That which we call a rose by any other name would smell as sweet.\u201D \u2014 Juliet"
    },
    M: {
      cls: "montague",
      house: "House Montague",
      tagline: "Loyal. Dreamy. Brave enough to follow your heart.",
      desc: "You are a loyal friend with a romantic soul. You trust your heart, stand by your people, and would sooner make peace than start a fight. You see the best in others and you're not afraid to feel things deeply. Just remember to look both ways before climbing any balconies.",
      traits: [
        "Sapphire and silver, like a moonlit sky",
        "You value loyalty, freedom, and true love",
        "Creative, kind, and wonderfully spontaneous",
        "You're the friend everyone calls at midnight"
      ],
      crew: "Your Verona crew: Romeo, Benvolio the peacemaker, and Lady Montague.",
      motto: "Follow your heart, and never leave a friend behind.",
      quote: "\u201CBut soft! What light through yonder window breaks?\u201D \u2014 Romeo"
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var answers = [], order = [], idx = 0, playerName = "";

  // ---------- falling petals ----------
  function makePetals() {
    var box = $("petals");
    box.innerHTML = "";
    var n = window.matchMedia("(max-width: 600px)").matches ? 14 : 24;
    for (var i = 0; i < n; i++) {
      var p = document.createElement("span");
      p.className = "petal";
      p.style.left = Math.random() * 100 + "%";
      p.style.animationDuration = (9 + Math.random() * 9) + "s";
      p.style.animationDelay = (-Math.random() * 16) + "s";
      p.style.transform = "scale(" + (0.7 + Math.random() * 0.9) + ")";
      box.appendChild(p);
    }
  }
  makePetals();

  function show(id) {
    ["intro", "quiz", "result"].forEach(function (s) { $(s).classList.toggle("on", s === id); });
    window.scrollTo(0, 0);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function start() {
    playerName = $("nameInput").value.trim();
    answers = []; idx = 0;
    order = QUESTIONS.map(function (q) { return shuffle(q.a); });
    document.body.className = "stage";
    show("quiz");
    renderQ();
  }

  function renderQ() {
    var q = QUESTIONS[idx];
    $("progLabel").textContent = "Question " + (idx + 1) + " of " + QUESTIONS.length;
    $("fill").style.width = (idx / QUESTIONS.length * 100) + "%";
    $("track").setAttribute("aria-valuenow", idx);
    $("qText").textContent = q.q;
    var box = $("opts");
    box.innerHTML = "";
    order[idx].forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.textContent = opt[0];
      b.addEventListener("click", function () { choose(b, opt[1]); });
      box.appendChild(b);
    });
    var card = document.querySelector("#quiz .scroll");
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "rise .45s ease both";
  }

  function choose(btn, house) {
    var all = document.querySelectorAll("#opts .opt");
    all.forEach(function (b) { b.disabled = true; });
    btn.classList.add("picked");
    answers.push(house);
    $("fill").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
    setTimeout(function () {
      idx++;
      if (idx < QUESTIONS.length) renderQ(); else finish();
    }, 420);
  }

  function finish() {
    var c = answers.filter(function (a) { return a === "C"; }).length;
    var m = answers.length - c;
    var win = c > m ? "C" : "M";
    var r = RESULTS[win];
    var pctC = Math.round(c / answers.length * 100);
    var pctM = 100 - pctC;
    document.body.className = r.cls;
    makePetals();

    var who = playerName ? (playerName + ", you belong to") : "You belong to";
    var traits = r.traits.map(function (t) { return "<li>" + t + "</li>"; }).join("");
    var crestId = win === "C" ? "shield-cap" : "shield-mon";

    $("result").innerHTML =
      '<svg class="crest" viewBox="0 0 100 116" role="img" aria-label="' + r.house + ' crest"><use href="#' + crestId + '"/></svg>' +
      '<div class="belong">' + who + '</div>' +
      '<h1>' + r.house + '</h1>' +
      '<div class="tagline">' + r.tagline + '</div>' +
      '<div class="card"><p>' + r.desc + '</p></div>' +
      '<div class="card"><h3>What this says about you</h3><ul>' + traits + '</ul></div>' +
      '<div class="card"><h3>Your crew</h3><p style="margin:0">' + r.crew + '</p></div>' +
      '<div class="motto">' + r.motto + '</div>' +
      '<div class="quote">' + r.quote + '</div>' +
      '<div class="split" aria-label="Capulet ' + pctC + ' percent, Montague ' + pctM + ' percent">' +
        '<div class="split-bar"><div class="c" style="width:' + pctC + '%"></div><div class="m" style="width:' + pctM + '%"></div></div>' +
        '<div class="split-text"><span>Capulet ' + pctC + '%</span><span>Montague ' + pctM + '%</span></div>' +
      '</div>' +
      '<p class="screenshot">Screenshot your result and show off your house!</p>' +
      '<button class="btn ghost" id="againBtn" type="button">Take the quiz again</button>';

    $("againBtn").addEventListener("click", function () {
      document.body.className = "stage";
      makePetals();
      show("intro");
    });
    show("result");
  }

  $("startBtn").addEventListener("click", start);
  $("nameInput").addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
})();
</script>
</body>
</html>
